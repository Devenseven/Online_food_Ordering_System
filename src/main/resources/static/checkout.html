<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Foodie Express</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">🍔 Foodie Express</a>
            <div class="nav-menu">
                <a href="/" class="nav-link">Home</a>
                <a href="/menu.html" class="nav-link">Menu</a>
                <a href="/cart.html" class="nav-link nav-cart">
                    Cart
                    <span id="cart-badge" class="cart-badge" style="display: none;">0</span>
                </a>
                <div id="nav-auth" style="display: flex; align-items: center; gap: 1rem;"></div>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 2rem; padding-bottom: 2rem;">
        <h1 style="margin-bottom: 2rem; font-size: 2rem;">Checkout</h1>
        
        <div id="loading" style="text-align: center; padding: 2rem;">Loading...</div>
        <div id="checkoutContent" style="display: none; display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
            <div class="card" style="padding: 1.5rem;">
                <h2 style="margin-bottom: 1.5rem;">Delivery Details</h2>
                <form id="checkoutForm" novalidate>
                    <div class="form-group">
                        <label for="address" class="form-label">Delivery Address *</label>
                        <textarea id="address" class="form-input form-textarea" required></textarea>
                        <div id="addressError" class="form-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="contact" class="form-label">Contact Number *</label>
                        <input type="tel" id="contact" class="form-input" required>
                        <div id="contactError" class="form-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="instructions" class="form-label">Delivery Instructions (optional)</label>
                        <textarea id="instructions" class="form-input form-textarea"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Payment Method</label>
                        <input type="text" class="form-input" value="Cash on Delivery (COD)" disabled>
                    </div>
                    <button type="submit" id="placeOrderBtn" class="btn" style="width: 100%;">Place Order</button>
                </form>
            </div>
            <div class="card" style="padding: 1.5rem; position: sticky; top: 100px;">
                <h2 style="margin-bottom: 1rem;">Order Summary</h2>
                <div id="checkoutItems" style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1rem;"></div>
                <div style="padding-top: 1rem; border-top: 2px solid var(--border);">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span>Subtotal</span>
                        <span id="checkoutSubtotal">$0.00</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem;">
                        <span>Delivery Fee</span>
                        <span>$0.00</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 1.25rem; font-weight: 700; padding-top: 0.75rem; border-top: 1px solid var(--border);">
                        <span>Total</span>
                        <span id="checkoutTotal" style="color: var(--primary);">$0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/js/api.js"></script>
    <script src="/js/checkout.js"></script>
</body>
</html>
