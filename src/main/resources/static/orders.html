<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Foodie Express</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">🍔 Foodie Express</a>
            <div class="nav-menu">
                <a href="/" class="nav-link">Home</a>
                <a href="/menu.html" class="nav-link">Menu</a>
                <a href="/cart.html" class="nav-link nav-cart">
                    Cart
                    <span id="cart-badge" class="cart-badge" style="display: none;">0</span>
                </a>
                <div id="nav-auth" style="display: flex; align-items: center; gap: 1rem;"></div>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 2rem; padding-bottom: 2rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1 style="font-size: 2rem;">My Orders</h1>
            <button onclick="loadOrders()" class="btn">Refresh</button>
        </div>
        
        <div id="loading" style="text-align: center; padding: 2rem;">Loading...</div>
        <div id="ordersList" style="display: flex; flex-direction: column; gap: 1rem;"></div>
        <div id="emptyState" style="text-align: center; padding: 3rem; display: none;">
            <h2 style="margin-bottom: 1rem;">No orders yet</h2>
            <p style="color: var(--text-light); margin-bottom: 1.5rem;">Start ordering from our menu</p>
            <a href="/menu.html" class="btn">Browse Menu</a>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/js/api.js"></script>
    <script src="/js/orders.js"></script>
</body>
</html>
