<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details - Foodie Express</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">🍔 Foodie Express</a>
            <div class="nav-menu">
                <a href="/" class="nav-link">Home</a>
                <a href="/menu.html" class="nav-link">Menu</a>
                <a href="/cart.html" class="nav-link nav-cart">
                    Cart
                    <span id="cart-badge" class="cart-badge" style="display: none;">0</span>
                </a>
                <div id="nav-auth" style="display: flex; align-items: center; gap: 1rem;"></div>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 2rem; padding-bottom: 2rem;">
        <div style="margin-bottom: 1.5rem;">
            <a href="/orders.html" style="color: var(--primary); text-decoration: none;">← Back to My Orders</a>
        </div>
        
        <div id="loading" style="text-align: center; padding: 2rem;">Loading...</div>
        <div id="orderContent" style="display: none;">
            <div class="card" style="padding: 1.5rem; margin-bottom: 1.5rem;">
                <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;">
                    <h1 style="font-size: 1.8rem;">Order #<span id="orderId"></span></h1>
                    <span id="orderStatus" class="badge" style="font-size: 1rem;"></span>
                </div>
                <p style="color: var(--text-light); margin-bottom: 0.5rem;"><strong>Order Date:</strong> <span id="orderDate"></span></p>
                <p style="color: var(--text-light); margin-bottom: 0.5rem;"><strong>Payment Method:</strong> <span id="paymentMethod"></span></p>
                <p style="color: var(--text-light);"><strong>Payment Status:</strong> <span id="paymentStatus"></span></p>
            </div>
            
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem;">
                <div>
                    <div class="card" style="padding: 1.5rem; margin-bottom: 1.5rem;">
                        <h2 style="margin-bottom: 1rem;">Order Items</h2>
                        <div id="orderItems" style="display: flex; flex-direction: column; gap: 0.75rem;"></div>
                    </div>
                    <div class="card" style="padding: 1.5rem;">
                        <h2 style="margin-bottom: 1rem;">Delivery Details</h2>
                        <p style="margin-bottom: 0.5rem;"><strong>Address:</strong> <span id="deliveryAddress"></span></p>
                        <p style="margin-bottom: 0.5rem;"><strong>Contact:</strong> <span id="contactNumber"></span></p>
                        <p><strong>Instructions:</strong> <span id="deliveryInstructions"></span></p>
                    </div>
                </div>
                <div>
                    <div class="card" style="padding: 1.5rem; position: sticky; top: 100px;">
                        <h2 style="margin-bottom: 1rem;">Order Summary</h2>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <span>Subtotal</span>
                            <span id="subtotal"></span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem; padding-bottom: 0.75rem; border-bottom: 2px solid var(--border);">
                            <span>Delivery Fee</span>
                            <span id="deliveryFee"></span>
                        </div>
                        <div style="display: flex; justify-content: space-between; font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem;">
                            <span>Total</span>
                            <span id="total" style="color: var(--primary);"></span>
                        </div>
                        <button id="cancelBtn" onclick="cancelOrder()" class="btn btn-danger" style="width: 100%; display: none;">Cancel Order</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/js/api.js"></script>
    <script src="/js/order-details.js"></script>
</body>
</html>
