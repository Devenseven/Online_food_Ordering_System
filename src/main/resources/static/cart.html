<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Foodie Express</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">🍔 Foodie Express</a>
            <div class="nav-menu">
                <a href="/" class="nav-link">Home</a>
                <a href="/menu.html" class="nav-link">Menu</a>
                <a href="/cart.html" class="nav-link active nav-cart">
                    Cart
                    <span id="cart-badge" class="cart-badge" style="display: none;">0</span>
                </a>
                <div id="nav-auth" style="display: flex; align-items: center; gap: 1rem;"></div>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 2rem; padding-bottom: 2rem;">
        <h1 style="margin-bottom: 2rem; font-size: 2rem;">Shopping Cart</h1>
        
        <div id="loading" style="text-align: center; padding: 2rem;">Loading...</div>
        <div id="cartContent" style="display: none;">
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; align-items: start;">
                <div id="cartItems" style="display: flex; flex-direction: column; gap: 1rem;"></div>
                <div class="card" style="padding: 1.5rem; position: sticky; top: 100px;">
                    <h2 style="margin-bottom: 1rem;">Order Summary</h2>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem;">
                        <span>Subtotal</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 2px solid var(--border);">
                        <span>Delivery Fee</span>
                        <span>$0.00</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem;">
                        <span>Total</span>
                        <span id="total" style="color: var(--primary);">$0.00</span>
                    </div>
                    <a href="/checkout.html" class="btn" style="width: 100%;">Proceed to Checkout</a>
                    <button onclick="clearCart()" class="btn btn-secondary" style="width: 100%; margin-top: 0.75rem;">Clear Cart</button>
                </div>
            </div>
        </div>
        <div id="emptyCart" style="text-align: center; padding: 3rem; display: none;">
            <h2 style="margin-bottom: 1rem;">Your cart is empty</h2>
            <p style="color: var(--text-light); margin-bottom: 1.5rem;">Add some delicious items from our menu</p>
            <a href="/menu.html" class="btn">Browse Menu</a>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/js/api.js"></script>
    <script src="/js/cart.js"></script>
</body>
</html>
