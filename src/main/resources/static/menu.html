<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Foodie Express</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">🍔 Foodie Express</a>
            <div class="nav-menu">
                <a href="/" class="nav-link">Home</a>
                <a href="/menu.html" class="nav-link active">Menu</a>
                <a href="/cart.html" class="nav-link nav-cart">
                    Cart
                    <span id="cart-badge" class="cart-badge" style="display: none;">0</span>
                </a>
                <div id="nav-auth" style="display: flex; align-items: center; gap: 1rem;"></div>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 2rem; padding-bottom: 2rem;">
        <h1 style="margin-bottom: 2rem; font-size: 2rem;">Our Menu</h1>
        
        <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem; align-items: center;">
            <input type="text" id="searchInput" class="form-input" placeholder="Search food..." style="max-width: 300px;">
            <select id="categoryFilter" class="form-input" style="max-width: 200px;">
                <option value="">All Categories</option>
            </select>
            <select id="sortSelect" class="form-input" style="max-width: 200px;">
                <option value="">Default</option>
                <option value="price,asc">Price: Low to High</option>
                <option value="price,desc">Price: High to Low</option>
                <option value="name,asc">Name: A to Z</option>
            </select>
            <button id="applyFilters" class="btn">Apply</button>
        </div>
        
        <div id="loading" style="text-align: center; padding: 2rem;">Loading...</div>
        <div id="foodGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; display: none;"></div>
        <div id="emptyState" style="text-align: center; padding: 3rem; display: none;">
            <p style="color: var(--text-light); font-size: 1.1rem;">No food items found</p>
        </div>
        
        <div id="pagination" style="display: flex; gap: 0.5rem; justify-content: center; margin-top: 2rem; flex-wrap: wrap;"></div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/js/api.js"></script>
    <script src="/js/menu.js"></script>
</body>
</html>
