services:
  mysql:
    image: mysql:8.4
    container_name: foodordering-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: food_ordering
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - foodordering-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodordering-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/food_ordering?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      ADMIN_EMAIL: admin@foodordering.com
      ADMIN_PASSWORD: Admin@1234
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - foodordering-net

volumes:
  mysql_data:

networks:
  foodordering-net:
    driver: bridge
